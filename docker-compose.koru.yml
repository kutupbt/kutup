# Koru as the edge instead of nginx: a web application firewall and reverse
# proxy in one (docs/self-hosting.md, "Koru edge (optional)"). Opt-in, for the
# operator's own use: Koru has no licence yet and is not distributed with
# Kutup. Its image is built on a machine with a checkout of Koru's sources
# (scripts/build-koru-image.sh) and copied to the server by
# scripts/deploy.sh; it is never pulled from a registry. Add this file to
# the others; leave docker-compose.acme.yml out (Koru gets its own
# certificates with KORU_TLS=acme):
#
#   KUTUP_KORU_IMAGE=kutup-koru:<koru commit>-<koru/ hash> docker compose -f docker-compose.yml -f docker-compose.koru.yml up -d --wait
#
# koru/render.sh writes Koru's configuration at every start from the same
# settings as the apps (KUTUP_BASE_DOMAIN or KUTUP_<APP>_URL, MAIL_HOSTNAME,
# KUTUP_ACME_DOMAINS, KUTUP_ACME_EXTRA_DOMAINS, CHAT_SFU_URL, CHAT_SFU_TURN_DOMAIN, CHAT_TURN_URLS).
# KORU_MODE: detect (the default) logs what Koru would refuse; block refuses it.

services:
  # Left out: only Koru listens on the edge ports.
  nginx:
    profiles: ["nginx-edge"]

  koru:
    image: ${KUTUP_KORU_IMAGE:?set KUTUP_KORU_IMAGE to kutup-koru:<koru commit>-<koru/ hash> (scripts/build-koru-image.sh)}
    # Built here or copied here, never fetched.
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${KUTUP_HTTP_PORT:-38080}:8080"
      - "${KUTUP_HTTPS_PORT:-38443}:8443"
    # The SFU and the call relays run on the host network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KORU_MODE: ${KORU_MODE:-detect}
      # files: KORU_CERT and KORU_KEY under nginx/certs (readable by UID 65532);
      # acme: Koru's own Let's Encrypt certificates (publish ports 80 and 443).
      KORU_TLS: ${KORU_TLS:-files}
      KORU_CERT: /certs/fullchain.pem
      KORU_KEY: /certs/privkey.pem
      KORU_TRUSTED_PROXIES: ${KORU_TRUSTED_PROXIES:-}
      KORU_PROXY_PROTOCOL_FROM: ${KORU_PROXY_PROTOCOL_FROM:-}
      KORU_RELAY_PROXY_PROTOCOL: ${KORU_RELAY_PROXY_PROTOCOL:-}
      KORU_BLOCK_CONTACT: ${KORU_BLOCK_CONTACT:-}
      KUTUP_BASE_DOMAIN: ${KUTUP_BASE_DOMAIN:-}
      KUTUP_ACCOUNT_URL: ${KUTUP_ACCOUNT_URL:-}
      KUTUP_DRIVE_URL: ${KUTUP_DRIVE_URL:-}
      KUTUP_CHAT_URL: ${KUTUP_CHAT_URL:-}
      KUTUP_OFFICE_URL: ${KUTUP_OFFICE_URL:-}
      KUTUP_EDITOR_URL: ${KUTUP_EDITOR_URL:-}
      KUTUP_MAPS_URL: ${KUTUP_MAPS_URL:-}
      KUTUP_PHOTOS_URL: ${KUTUP_PHOTOS_URL:-}
      KUTUP_CONTACTS_URL: ${KUTUP_CONTACTS_URL:-}
      KUTUP_MAIL_URL: ${KUTUP_MAIL_URL:-}
      KUTUP_PASS_URL: ${KUTUP_PASS_URL:-}
      KUTUP_CALENDAR_URL: ${KUTUP_CALENDAR_URL:-}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-}
      KUTUP_ACME_DOMAINS: ${KUTUP_ACME_DOMAINS:-}
      KUTUP_ACME_EXTRA_DOMAINS: ${KUTUP_ACME_EXTRA_DOMAINS:-}
      KUTUP_ACME_EMAIL: ${KUTUP_ACME_EMAIL:-}
      KUTUP_ACME_STAGING: ${KUTUP_ACME_STAGING:-0}
      CHAT_SFU_URL: ${CHAT_SFU_URL:-}
      CHAT_SFU_TURN_DOMAIN: ${CHAT_SFU_TURN_DOMAIN:-}
      CHAT_TURN_URLS: ${CHAT_TURN_URLS:-}
    volumes:
      # Writable for KORU_TLS=acme, whose export keeps the certificate here
      # for every service that reads it (koru/render.sh).
      - ./nginx/certs:/certs
      # The ACME account and certificates (KORU_TLS=acme).
      - koru_state:/var/lib/koru
    # The configuration is written at start into a memory file system.
    read_only: true
    tmpfs:
      - /etc/koru:uid=65532,gid=65532,mode=0755
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - backend
      - frontend
    # Healthy when Koru answers and the backend behind it does, as nginx's
    # check (through the edge) waits for both: `up --wait` relies on it.
    healthcheck:
      test: ["CMD", "/bin/busybox", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8080/healthz && wget -q -O /dev/null http://backend:3000/api/v1/auth/settings"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Koru passes TURN over TLS through undecrypted (it has no TLS ending for
  # passed-through connections), so the relays end TLS themselves with the
  # same certificate. KORU_RELAY_CERT / KORU_RELAY_KEY: with KORU_TLS=acme,
  # Koru's files for the relays, /koru/acme/certs/<first relay name>.crt and .key.
  coturn:
    # Koru's certificate files are readable by its user only.
    user: "65532:65532"
    environment:
      TURN_TLS_CERT: ${KORU_RELAY_CERT:-/certs/fullchain.pem}
      TURN_TLS_KEY: ${KORU_RELAY_KEY:-/certs/privkey.pem}
    volumes:
      - ./nginx/certs:/certs:ro
      - koru_state:/koru:ro

  livekit:
    environment:
      LIVEKIT_TURN_CERT: ${KORU_RELAY_CERT:-/certs/fullchain.pem}
      LIVEKIT_TURN_KEY: ${KORU_RELAY_KEY:-/certs/privkey.pem}
    volumes:
      - ./nginx/certs:/certs:ro
      - koru_state:/koru:ro

volumes:
  koru_state:
