services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kutup}
      POSTGRES_USER: ${POSTGRES_USER:-kutup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kutup}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: master -mdir=/data -defaultReplication=000
    volumes:
      - ./data/seaweedfs-master:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -max=100
    volumes:
      - ./data/seaweedfs-volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333 -s3
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: s3 -filer=seaweedfs-filer:8888 -port=8333
    environment:
      # With no static S3 config file, SeaweedFS treats these as fallback admin
      # credentials. Keep them identical to the initializer and backend values.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-kutup}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-kutup_dev_s3_secret}
    depends_on:
      - seaweedfs-filer
    # No ports exposed — only reachable from backend/nginx internally

  seaweedfs-init:
    image: amazon/aws-cli:latest
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-kutup}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-kutup_dev_s3_secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-kutup-files}
    volumes:
      - ./seaweedfs-init.sh:/seaweedfs-init.sh:ro
      - ./lifecycle.json:/etc/kutup/lifecycle.json:ro
    entrypoint: ["sh", "/seaweedfs-init.sh"]
    depends_on:
      - seaweedfs-s3

  backend:
    # The Rust kutup-server (Axum). Build context is the workspace root so the Cargo
    # workspace + the embedded migrations (crates/kutup-server/migrations) are available.
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    # The bundled SFU runs on the host network (CHAT_SFU_API_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kutup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kutup}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      # The bundled SeaweedFS; docker-compose.external-s3.yml points this at another store.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs-s3:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kutup}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kutup_dev_s3_secret}
      S3_BUCKET: ${S3_BUCKET:-kutup-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      APP_ENV: ${APP_ENV:-production}
      # This server's canonical external address (docs/self-hosting.md). In
      # production it must be HTTPS; it also anchors the server identity that
      # Chat groups need.
      SERVER_URL: ${SERVER_URL:-}
      # Where each web app lives (https://<app>.<KUTUP_BASE_DOMAIN>, or the
      # explicit URLs); the frontend container serves the same hostnames.
      KUTUP_BASE_DOMAIN: ${KUTUP_BASE_DOMAIN:-}
      KUTUP_ACCOUNT_URL: ${KUTUP_ACCOUNT_URL:-}
      KUTUP_DRIVE_URL: ${KUTUP_DRIVE_URL:-}
      KUTUP_CHAT_URL: ${KUTUP_CHAT_URL:-}
      KUTUP_OFFICE_URL: ${KUTUP_OFFICE_URL:-}
      KUTUP_EDITOR_URL: ${KUTUP_EDITOR_URL:-}
      KUTUP_MAPS_URL: ${KUTUP_MAPS_URL:-}
      KUTUP_PHOTOS_URL: ${KUTUP_PHOTOS_URL:-}
      KUTUP_CONTACTS_URL: ${KUTUP_CONTACTS_URL:-}
      KUTUP_MAIL_URL: ${KUTUP_MAIL_URL:-}
      # The map relay's shared tile cache; its size is set on the admin Maps page.
      MAPS_CACHE_DIR: /var/cache/kutup-maps
      # Single break-glass admin (email:username:password) — created on first boot; it can
      # never be demoted/disabled/deleted via the API.
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-}
      # SeaweedFS master — probed for real storage capacity + usage (admin dashboard).
      SEAWEEDFS_MASTER_URL: ${SEAWEEDFS_MASTER_URL:-http://seaweedfs-master:9333}
      # Fallback capacity for the admin Settings card when the probe is unavailable. 0 → hidden.
      STORAGE_TOTAL_BYTES: ${STORAGE_TOTAL_BYTES:-0}
      # Days a trashed item stays restorable before the sweeper purges it. 0 disables the sweep.
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      CHAT_MAILBOX_RETENTION_DAYS: ${CHAT_MAILBOX_RETENTION_DAYS:-30}
      CHAT_SEND_RETENTION_DAYS: ${CHAT_SEND_RETENTION_DAYS:-30}
      CHAT_MEDIA_DELIVERY_RETENTION_DAYS: ${CHAT_MEDIA_DELIVERY_RETENTION_DAYS:-45}
      CHAT_DEVICE_EXPIRY_DAYS: ${CHAT_DEVICE_EXPIRY_DAYS:-90}
      CHAT_MAX_ACTIVE_DEVICES: ${CHAT_MAX_ACTIVE_DEVICES:-10}
      CHAT_MEDIA_MAX_PLAINTEXT_BYTES: ${CHAT_MEDIA_MAX_PLAINTEXT_BYTES:-2147483648}
      CHAT_GROUPS: ${CHAT_GROUPS:-true}
      CHAT_LINK_PREVIEWS: ${CHAT_LINK_PREVIEWS:-true}
      CHAT_SERVER_NAME: ${CHAT_SERVER_NAME:-kutup.local}
      FEDERATION_SERVER_NAME: ${FEDERATION_SERVER_NAME:-}
      FEDERATION_SIGNING_KEY: ${FEDERATION_SIGNING_KEY:-}
      FEDERATION_NEXT_SIGNING_KEY: ${FEDERATION_NEXT_SIGNING_KEY:-}
      FEDERATION_TEST_ALLOW_PRIVATE: ${FEDERATION_TEST_ALLOW_PRIVATE:-false}
      CHAT_SEALED_SENDER_POLICY: ${CHAT_SEALED_SENDER_POLICY:-}
      CHAT_SEALED_SENDER_ONLINE_PRIVATE_KEY: ${CHAT_SEALED_SENDER_ONLINE_PRIVATE_KEY:-}
      CHAT_MLS_ORDERING_POLICY: ${CHAT_MLS_ORDERING_POLICY:-}
      CHAT_MLS_CONTROL_SIGNING_KEY: ${CHAT_MLS_CONTROL_SIGNING_KEY:-}
      CHAT_WEB_PUSH: ${CHAT_WEB_PUSH:-true}
      CHAT_WEB_PUSH_HOSTS: ${CHAT_WEB_PUSH_HOSTS:-}
      CHAT_WEB_PUSH_SUBJECT: ${CHAT_WEB_PUSH_SUBJECT:-}
      CHAT_STUN_URLS: ${CHAT_STUN_URLS:-}
      CHAT_TURN_URLS: ${CHAT_TURN_URLS:-}
      CHAT_TURN_SECRET: ${CHAT_TURN_SECRET:-}
      CHAT_SFU_URL: ${CHAT_SFU_URL:-}
      # Where this server reaches the SFU's API to remove a participant or end
      # a meeting. Blank: CHAT_SFU_URL. With the bundled LiveKit (host network):
      # http://host.docker.internal:7880
      CHAT_SFU_API_URL: ${CHAT_SFU_API_URL:-}
      CHAT_SFU_API_KEY: ${CHAT_SFU_API_KEY:-}
      CHAT_SFU_API_SECRET: ${CHAT_SFU_API_SECRET:-}
      # Per-IP/account rate limits + per-account login lockout (blank → server defaults).
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-}
      RATE_LIMIT_PREFLIGHT_PER_MIN: ${RATE_LIMIT_PREFLIGHT_PER_MIN:-}
      RATE_LIMIT_FORK_PER_MIN: ${RATE_LIMIT_FORK_PER_MIN:-}
      RATE_LIMIT_CALL_LINK_PER_MIN: ${RATE_LIMIT_CALL_LINK_PER_MIN:-}
      RATE_LIMIT_CALL_LINK_POLL_PER_MIN: ${RATE_LIMIT_CALL_LINK_POLL_PER_MIN:-}
      RATE_LIMIT_CHAT_KEYS_PER_MIN: ${RATE_LIMIT_CHAT_KEYS_PER_MIN:-}
      RATE_LIMIT_CHAT_KEYS_IP_PER_MIN: ${RATE_LIMIT_CHAT_KEYS_IP_PER_MIN:-}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-}
      RATE_LIMIT_RECOVERY_PER_HOUR: ${RATE_LIMIT_RECOVERY_PER_HOUR:-}
      RATE_LIMIT_FED_USERS_PER_MIN: ${RATE_LIMIT_FED_USERS_PER_MIN:-}
      RATE_LIMIT_ADMIN_PER_MIN: ${RATE_LIMIT_ADMIN_PER_MIN:-}
      LOGIN_LOCKOUT_THRESHOLD: ${LOGIN_LOCKOUT_THRESHOLD:-}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-}
    volumes:
      - maps_cache:/var/cache/kutup-maps
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  frontend:
    # The four web apps, each served on its own hostname: the same app
    # addresses the backend publishes (KUTUP_BASE_DOMAIN gives
    # https://<app>.<domain>; the explicit URLs override it).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      KUTUP_BASE_DOMAIN: ${KUTUP_BASE_DOMAIN:-}
      KUTUP_ACCOUNT_URL: ${KUTUP_ACCOUNT_URL:-}
      KUTUP_DRIVE_URL: ${KUTUP_DRIVE_URL:-}
      KUTUP_CHAT_URL: ${KUTUP_CHAT_URL:-}
      KUTUP_OFFICE_URL: ${KUTUP_OFFICE_URL:-}
      KUTUP_EDITOR_URL: ${KUTUP_EDITOR_URL:-}
      KUTUP_MAPS_URL: ${KUTUP_MAPS_URL:-}
      KUTUP_PHOTOS_URL: ${KUTUP_PHOTOS_URL:-}
      KUTUP_CONTACTS_URL: ${KUTUP_CONTACTS_URL:-}
      KUTUP_MAIL_URL: ${KUTUP_MAIL_URL:-}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${KUTUP_HTTP_PORT:-38080}:80"
      - "${KUTUP_HTTPS_PORT:-38443}:443"
      # HTTP/3 (QUIC); browsers fall back to TCP without it.
      - "${KUTUP_HTTPS_PORT:-38443}:443/udp"
    # The SFU for group calls runs on the host network (nginx.conf).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --output-document=/dev/null https://127.0.0.1/api/auth/settings"]
      interval: 2s
      timeout: 5s
      retries: 30

  # TURN relay for Chat calls (optional: `docker compose --profile turn up`).
  # It relays only DTLS-SRTP packets it cannot read; credentials come from the
  # backend (CHAT_TURN_SECRET). Host networking keeps the relay port range
  # reachable without publishing thousands of ports.
  coturn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${CHAT_TURN_SECRET:-}
      TURN_REALM: ${CHAT_TURN_REALM:-kutup}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$TURN_SECRET" ] || { echo 'set CHAT_TURN_SECRET for the TURN relay' >&2; exit 1; };
        exec turnserver --use-auth-secret --static-auth-secret="$$TURN_SECRET"
        --realm="$$TURN_REALM" --listening-port=3478 --min-port=49160 --max-port=49200
        --no-cli --no-multicast-peers --fingerprint --log-file=stdout
        --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255
        --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255

  # SFU for group calls (optional: `docker compose --profile sfu up`). Frames
  # arrive end-to-end encrypted. The bundled nginx serves it at
  # wss://sfu.<domain> (set that as CHAT_SFU_URL; the name needs DNS and a
  # place on the certificate); open UDP 50000-60000 and TCP 7881. With
  # CHAT_SFU_TURN_DOMAIN (sfu-turn.<domain>, also on the certificate) it
  # relays media over TLS on port 443 for networks that allow nothing else:
  # nginx ends the TLS and hands the connection to port 5349 here.
  livekit:
    image: livekit/livekit-server:v1.13
    profiles: ["sfu"]
    restart: unless-stopped
    network_mode: host
    environment:
      SFU_KEY: ${CHAT_SFU_API_KEY:-}
      SFU_SECRET: ${CHAT_SFU_API_SECRET:-}
      SFU_TURN_DOMAIN: ${CHAT_SFU_TURN_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$SFU_KEY" ] && [ -n "$$SFU_SECRET" ] || { echo 'set CHAT_SFU_API_KEY and CHAT_SFU_API_SECRET' >&2; exit 1; };
        turn=""; [ -z "$$SFU_TURN_DOMAIN" ] || turn="--turn.enabled --turn.domain $$SFU_TURN_DOMAIN --turn.tls_port 5349 --turn.external_tls";
        LIVEKIT_KEYS="$$SFU_KEY: $$SFU_SECRET" exec /livekit-server --port 7880 --rtc.tcp_port 7881 --rtc.port_range_start 50000 --rtc.port_range_end 60000 --rtc.use_external_ip $$turn

volumes:
  postgres_data:
  maps_cache:
