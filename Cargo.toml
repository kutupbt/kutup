# Root Cargo workspace — the kutup backend + CLI (Rust; the former Go `backend/` + `cmd/kutup/`
# were rewritten here and removed).
#
# Crates (see docs/contributing.md and CLAUDE.md):
#   crates/kutup-crypto  — shared E2EE primitives; the canonical mirror partner of
#                          frontend/src/crypto/ (libsodium-wrappers). Used by the CLI
#                          and (for the collab envelope) the server.
#   crates/kutup-cli     — the `kutup` CLI         (binary `kutup`)
#   crates/kutup-server  — the backend API binary  (binary `kutup-server`; Axum + sqlx)
#   crates/kutup-pass    — Kutup Pass core: KeePass (KDBX) vaults and their three-way merge
#   crates/kutup-group-send — group send endorsements (libsignal zkgroup) for Chat's
#                          multi-recipient route; the server and Chat core share it
[workspace]
resolver = "2"
members = ["crates/*"]
# kutup-chat-core pulls the whole libsignal dependency
# tree (git, ~large) and needs protoc at build time, so it must not tax the
# app/server/CLI `cargo build`/`cargo test`. It is its own standalone workspace
# and depends on kutup-chat-proto by path. The native/wasm chat clients link it.
# crates/kutup-pass/vendor/keepass is the patched KDBX library behind
# kutup-pass (its KUTUP.md); it is upstream's code, so it stays out of the
# workspace's lints.
exclude = ["crates/kutup-chat-core", "crates/kutup-client-ffi", "fuzz", "crates/kutup-pass/vendor/keepass"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
# Tracks the highest MSRV in the locked dep graph (currently the aws-sdk-* family).
rust-version = "1.91.1"

# Shared dependency versions, pinned once for the whole workspace.
[workspace.dependencies]
# Crypto — libsodium-compatible primitives in pure Rust (no C toolchain), plus the
# RustCrypto crates for the constructions dryoc does not expose (HKDF-SHA256, the
# IETF XChaCha20-Poly1305 AEAD used for asset blobs, and Ed25519 frame signatures).
dryoc = "0.7"
hkdf = "0.12"
hmac = "0.12"
unicode-normalization = "0.1"
sha2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
# Yjs in Rust (the Yjs project's own port, same update encoding): Kutup's
# collaboration content for peers without a browser (crates/kutup-collab).
# Pinned with the web's yjs: the seed vectors must keep passing on any bump.
yrs = "=0.28.0"
similar = "2"
p256 = "0.13"
# BIP39 recovery-phrase encoding (English wordlist) — mirrors frontend/src/crypto/mnemonic.ts.
bip39 = "2"

# Common plumbing.
thiserror = "2"
base64 = "0.22"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order so json! output matches the Go CLI's printf key ordering.
serde_json = { version = "1", features = ["preserve_order"] }

# CLI (kutup-cli).
clap = { version = "4", features = ["derive"] }
# TLS on rustls with aws-lc-rs only, which prefers the post-quantum
# X25519MLKEM768 key exchange; every binary installs it as the process
# default at start (`tls::install_crypto_provider`). No build compiles ring:
# Cargo.lock lists it only as an optional dependency of rustls-webpki and
# hickory-proto that nothing enables (`cargo tree -i ring --target all` is
# empty).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "stream", "rustls-tls-webpki-roots-no-provider"] }
# `aws_lc_rs` also turns on aws-lc-sys's `prebuilt-nasm`, which the Windows
# (x86_64-pc-windows-msvc) CLI release needs: its runners have no NASM.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging"] }
anyhow = "1"
dirs = "6"
# Linux Secret Service needs libdbus (a C dep); we use native keychains on
# macOS/Windows and a chmod-600 file fallback on Linux (see session.rs).
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
redb = "2"
rpassword = "7"
rand = "0.8"
indicatif = "0.17"
# Extension → MIME lookup (already in the graph via reqwest's multipart feature).
mime_guess = "2"
qrcode = "0.14"
time = { version = "0.3", features = ["formatting", "serde", "serde-well-known"] }
notify = "6"
url = "2"
# Unicode general categories: names refuse control and format characters.
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

# Server (kutup-server).
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "catch-panic", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "tls-aws-lc", "metrics", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
# S3 (SeaweedFS) — replaces aws-sdk-go-v2.
aws-config = "1"
# Default features minus the legacy `rustls` one, which pulls rustls 0.21 and a
# vulnerable rustls-webpki 0.101; `default-https-client` is rustls 0.23.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-credential-types = "1"
# Stream S3 object bodies into Axum responses, and buffer multipart uploads to disk.
tokio-util = { version = "0.7", features = ["io"] }
# Split the collab WebSocket into independent read/write halves.
futures-util = { version = "0.3", default-features = false }
tempfile = "3"
multer = "3"
# OpenAPI — replaces swaggo/swag. The interactive swagger-ui crate downloads its UI
# bundle from GitHub at build time, which breaks offline/sandboxed builds; we generate
# the spec with utoipa and serve the raw JSON instead (see docs/roadmap.md).
utoipa = { version = "5", features = ["axum_extras", "time", "uuid", "preserve_order", "repr"] }
# Auth + 2FA (server slice 2).
# jsonwebtoken v10 ships no crypto backend by default — `rust_crypto` keeps the
# pure-Rust posture (the alternative, `aws_lc_rs`, drags in a C/asm build).
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.16"
# otpauth = get_url() (the QR URI Go returns); gen_secret = Secret::generate_secret().
totp-rs = { version = "5", default-features = false, features = ["otpauth", "gen_secret"] }

# Dev / test.
hex = "0.4"

# libsignal's zkgroup (kutup-group-send) needs Signal's curve25519-dalek fork
# in place of crates.io's: zkgroup names the fork, zkcredential the crates.io
# name, and libsignal patches one onto the other in its own workspace, which
# doesn't reach a dependent. The fork is upstream 4.1.3 plus Lizard encoding.
# Named by the tag, not a rev: the source must be exactly the one libsignal's
# crates use for the fork (`curve25519-dalek-signal`), or Cargo builds two
# copies and zkgroup's types don't match. Cargo.lock pins the tag to commit
# 7c6d34756355a3566a704da84dce7b1c039a6572, and every check runs --locked.
[patch.crates-io]
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[profile.release]
# Match the security-conscious, debuggable posture; tune later for the server/CLI.
opt-level = 2

# The browser's WASM builds (scripts/build-crypto-wasm.sh): whole-program
# optimisation makes the module smaller and no slower; it is downloaded and
# compiled on every first visit (docs/research/18-web-performance.md).
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
