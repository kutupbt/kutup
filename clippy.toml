# reqwest is built without a TLS provider of its own (rustls on aws-lc-rs,
# X25519MLKEM768 first): a client built directly panics with "No provider set"
# wherever the process default isn't installed yet. Build clients through the
# helpers, which install it first.
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "use tls::client_builder() (server, CLI) or common::client() (tests)" },
    { path = "reqwest::Client::builder", reason = "use tls::client_builder() (server, CLI) or common::client_builder() (tests)" },
    { path = "reqwest::ClientBuilder::new", reason = "use tls::client_builder() (server, CLI) or common::client_builder() (tests)" },
    { path = "reqwest::blocking::Client::new", reason = "use common::client() (tests) or tls::client_builder() (CLI)" },
    { path = "reqwest::blocking::Client::builder", reason = "use common::client_builder() (tests) or tls::client_builder() (CLI)" },
    { path = "reqwest::blocking::ClientBuilder::new", reason = "use common::client_builder() (tests) or tls::client_builder() (CLI)" },
    { path = "reqwest::get", reason = "build a client with tls::client_builder() first" },
    { path = "reqwest::blocking::get", reason = "build a client with common::client() first" },
    # Algorithms are named only in kutup_crypto::primitives and the named
    # adapters (docs/plans/crypto-primitives.md); everything else asks it.
    # `allow-invalid`: a crate without the dependency can't name it anyway.
    { path = "rand::thread_rng", reason = "use kutup_crypto::primitives::random", allow-invalid = true },
    { path = "getrandom::fill", reason = "use kutup_crypto::primitives::random", allow-invalid = true },
    { path = "getrandom::getrandom", reason = "use kutup_crypto::primitives::random", allow-invalid = true },
    { path = "dryoc::rng::copy_randombytes", reason = "use kutup_crypto::primitives::random", allow-invalid = true },
    { path = "dryoc::classic::crypto_pwhash::crypto_pwhash", reason = "use kutup_crypto::primitives::pwhash", allow-invalid = true },
    { path = "dryoc::classic::crypto_secretstream_xchacha20poly1305::crypto_secretstream_xchacha20poly1305_init_push", reason = "the block format; until then kutup_crypto::stream", allow-invalid = true },
    { path = "dryoc::classic::crypto_secretstream_xchacha20poly1305::crypto_secretstream_xchacha20poly1305_init_pull", reason = "the block format; until then kutup_crypto::stream", allow-invalid = true },
    { path = "dryoc::classic::crypto_secretstream_xchacha20poly1305::crypto_secretstream_xchacha20poly1305_push", reason = "the block format; until then kutup_crypto::stream", allow-invalid = true },
    { path = "dryoc::classic::crypto_secretstream_xchacha20poly1305::crypto_secretstream_xchacha20poly1305_pull", reason = "the block format; until then kutup_crypto::stream", allow-invalid = true },
    { path = "dryoc::classic::crypto_secretstream_xchacha20poly1305::crypto_secretstream_xchacha20poly1305_keygen", reason = "use kutup_crypto::primitives::random_key", allow-invalid = true },
    { path = "dryoc::classic::crypto_core::crypto_scalarmult", reason = "use kutup_crypto::primitives (HPKE), or an adapter", allow-invalid = true },
    { path = "dryoc::classic::crypto_core::crypto_scalarmult_base", reason = "use kutup_crypto::primitives (HPKE), or an adapter", allow-invalid = true },
    { path = "dryoc::classic::crypto_box::crypto_box_seal", reason = "use kutup_crypto::primitives::hpke_seal", allow-invalid = true },
    { path = "dryoc::classic::crypto_box::crypto_box_seal_open", reason = "use kutup_crypto::primitives::hpke_open", allow-invalid = true },
    { path = "dryoc::classic::crypto_secretbox::crypto_secretbox_easy", reason = "use kutup_crypto::primitives::Aead", allow-invalid = true },
    { path = "dryoc::classic::crypto_secretbox::crypto_secretbox_open_easy", reason = "use kutup_crypto::primitives::Aead", allow-invalid = true },
    { path = "dryoc::classic::crypto_generichash::crypto_generichash", reason = "use kutup_crypto::primitives::hash", allow-invalid = true },
    { path = "ed25519_dalek::Verifier::verify", reason = "use kutup_crypto::primitives::VerifyingKey (strict)", allow-invalid = true },
    { path = "rand::rng", reason = "use kutup_crypto::primitives::random", allow-invalid = true },
]
disallowed-types = [
    { path = "chacha20poly1305::XChaCha20Poly1305", reason = "use kutup_crypto::primitives::Aead", allow-invalid = true },
    { path = "chacha20poly1305::ChaCha20Poly1305", reason = "use kutup_crypto::primitives::Aead", allow-invalid = true },
    { path = "hkdf::Hkdf", reason = "use kutup_crypto::primitives::kdf", allow-invalid = true },
    { path = "hmac::Hmac", reason = "use kutup_crypto::primitives::{mac, subkey}", allow-invalid = true },
    { path = "sha2::Sha256", reason = "use kutup_crypto::primitives::{hash, Hasher}", allow-invalid = true },
    { path = "sha2::Sha512", reason = "use kutup_crypto::primitives::{hash, Hasher}", allow-invalid = true },
    { path = "ed25519_dalek::SigningKey", reason = "use kutup_crypto::primitives::SigningKey", allow-invalid = true },
    { path = "ed25519_dalek::VerifyingKey", reason = "use kutup_crypto::primitives::VerifyingKey", allow-invalid = true },
    { path = "rand::rngs::OsRng", reason = "use kutup_crypto::primitives::random", allow-invalid = true },
    { path = "rand_core::OsRng", reason = "use kutup_crypto::primitives::random", allow-invalid = true },
    { path = "x25519_dalek::StaticSecret", reason = "use kutup_crypto::primitives (HPKE)", allow-invalid = true },
    { path = "x25519_dalek::EphemeralSecret", reason = "use kutup_crypto::primitives (HPKE)", allow-invalid = true },
    { path = "x25519_dalek::ReusableSecret", reason = "use kutup_crypto::primitives (HPKE)", allow-invalid = true },
    { path = "x25519_dalek::PublicKey", reason = "use kutup_crypto::primitives (HPKE)", allow-invalid = true },
    { path = "x25519_dalek::SharedSecret", reason = "use kutup_crypto::primitives (HPKE)", allow-invalid = true },
    { path = "hpke_rs::Hpke", reason = "use kutup_crypto::primitives::{hpke_seal, hpke_open}", allow-invalid = true },
    { path = "chacha20poly1305::ChaChaPoly1305", reason = "use kutup_crypto::primitives::Aead", allow-invalid = true },
    { path = "sha2::Sha224", reason = "use kutup_crypto::primitives::{hash, Hasher}", allow-invalid = true },
    { path = "sha2::Sha384", reason = "use kutup_crypto::primitives::{hash, Hasher}", allow-invalid = true },
    { path = "sha2::Sha512_256", reason = "use kutup_crypto::primitives::{hash, Hasher}", allow-invalid = true },
]
