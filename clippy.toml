# reqwest is built without a TLS provider of its own (rustls on aws-lc-rs,
# X25519MLKEM768 first): a client built directly panics with "No provider set"
# wherever the process default isn't installed yet. Build clients through the
# helpers, which install it first.
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "use tls::client_builder() (server, CLI) or common::client() (tests)" },
    { path = "reqwest::Client::builder", reason = "use tls::client_builder() (server, CLI) or common::client_builder() (tests)" },
    { path = "reqwest::ClientBuilder::new", reason = "use tls::client_builder() (server, CLI) or common::client_builder() (tests)" },
    { path = "reqwest::blocking::Client::new", reason = "use common::client() (tests) or tls::client_builder() (CLI)" },
    { path = "reqwest::blocking::Client::builder", reason = "use common::client_builder() (tests) or tls::client_builder() (CLI)" },
    { path = "reqwest::blocking::ClientBuilder::new", reason = "use common::client_builder() (tests) or tls::client_builder() (CLI)" },
    { path = "reqwest::get", reason = "build a client with tls::client_builder() first" },
    { path = "reqwest::blocking::get", reason = "build a client with common::client() first" },
    # Algorithms are named only in kutup_crypto::primitives and the named
    # adapters (docs/plans/crypto-primitives.md); everything else asks it.
    { path = "rand::thread_rng", reason = "use kutup_crypto::primitives::random" },
    { path = "rand::rng", reason = "use kutup_crypto::primitives::random" },
    { path = "getrandom::fill", reason = "use kutup_crypto::primitives::random" },
    { path = "getrandom::getrandom", reason = "use kutup_crypto::primitives::random" },
    { path = "dryoc::rng::copy_randombytes", reason = "use kutup_crypto::primitives::random" },
    { path = "dryoc::classic::crypto_pwhash::crypto_pwhash", reason = "use kutup_crypto::primitives::pwhash" },
]
disallowed-types = [
    { path = "chacha20poly1305::XChaCha20Poly1305", reason = "use kutup_crypto::primitives::Aead" },
    { path = "chacha20poly1305::ChaCha20Poly1305", reason = "use kutup_crypto::primitives::Aead" },
    { path = "hkdf::Hkdf", reason = "use kutup_crypto::primitives::kdf" },
    { path = "hmac::Hmac", reason = "use kutup_crypto::primitives::{mac, subkey}" },
    { path = "sha2::Sha256", reason = "use kutup_crypto::primitives::{hash, Hasher}" },
    { path = "sha2::Sha512", reason = "use kutup_crypto::primitives::{hash, Hasher}" },
    { path = "ed25519_dalek::SigningKey", reason = "use kutup_crypto::primitives::SigningKey" },
    { path = "ed25519_dalek::VerifyingKey", reason = "use kutup_crypto::primitives::VerifyingKey" },
    { path = "rand::rngs::OsRng", reason = "use kutup_crypto::primitives::random" },
    { path = "rand_core::OsRng", reason = "use kutup_crypto::primitives::random" },
]
