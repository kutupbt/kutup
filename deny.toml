# cargo-deny policy for every Cargo root: the workspace, fuzz/,
# crates/kutup-chat-core and crates/kutup-client-ffi. `scripts/gate.sh deny`
# runs it from the repository root with --manifest-path for each (part of the
# static gate; weekly in .github/workflows/advisories.yml).
#
# An advisory is ignored only with the reason it does not reach Kutup and what
# lifts it; docs/roadmap.md "Security · dependency advisories left open" keeps
# the same list. Remove an entry as soon as its fix is in the lockfile.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail like vulnerabilities unless listed below.
unmaintained = "all"
yanked = "deny"
ignore = [
    # libcrux-sha3 0.0.8: wrong output from repeated incremental portable SHAKE
    # squeezes, and a panic in AVX2 SHAKE-256 for odd output lengths. Neither
    # touches ML-KEM (both advisories say so). In hpke-rs 0.6.1 it is reached
    # only through `derive_key_pair`, and Kutup never calls that: every X-Wing
    # key (Drive keys, the groups' gateway keys) is a 32-byte seed expanded by
    # RustCrypto's x-wing, which hashes with RustCrypto's sha3.
    # Lifted by libsignal pinning libcrux-ml-kem >= the fixed sha3, and a newer
    # hpke-rs.
    { id = "RUSTSEC-2026-0207", reason = "SHAKE incremental squeeze: not used by ML-KEM, nor by any hpke-rs call Kutup makes" },
    { id = "RUSTSEC-2026-0208", reason = "AVX2 SHAKE-256 odd lengths: not used by ML-KEM, nor by any hpke-rs call Kutup makes" },
    # libcrux-secrets 0.0.5: constant-time swap/select may be wrong on aarch64,
    # inside libsignal 0.97.2's ML-KEM (=0.0.5 pin). The browser runs it as
    # WASM (no aarch64 assembly) and the server uses libsignal only for sealed
    # sender certificates. Native aarch64 clients (the native apps, not started)
    # need it fixed: lifted by a libsignal release pinning >= 0.0.6.
    { id = "RUSTSEC-2026-0212", reason = "aarch64-only, in libsignal's ML-KEM; web is WASM, native apps not started; needs a libsignal bump" },
    # rsa 0.9.10, Marvin: its private-key operation isn't constant time, so
    # one who can time many of them may learn the key. No fixed release. The
    # only private-key use is Pass's SSH agent signing with a vault's RSA SSH
    # key (crates/kutup-pass/src/ssh.rs), blinded with the OS RNG; nothing
    # decrypts with RSA (Mail's keys are Ed25519 + Curve25519, the server's
    # JWTs HS256). Signatures go only to the agent's owner-only local socket,
    # each approved on the desktop (or per host until the agent locks; never
    # for a forwarded request): timing one needs code running as the user,
    # who can already use the key. An SSH server sees one signature per login
    # through the network, too few and too noisy to time. Lift when rsa ships
    # a constant-time release (0.10).
    { id = "RUSTSEC-2023-0071", reason = "Pass's SSH agent signs with RSA, blinded, on an owner-only local socket with desktop approval; no fixed release" },
    # Unmaintained, no replacement in their parents yet:
    { id = "RUSTSEC-2025-0119", reason = "number_prefix: indicatif's progress bars in the CLI" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: a build-time macro of hax-lib under libsignal's ML-KEM" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr: inside yrs (Yjs) in kutup-collab" },
    # basic-toml 0.1.10: read by askama_derive 0.16 (a compile-time template
    # macro) under uniffi_bindgen, only with kutup-client-ffi's `bindgen`
    # feature, the tool that writes the Swift/Kotlin sources. Nothing shipped
    # links it (not in `cargo tree -e normal` of the default build). uniffi
    # 0.32.2 still takes askama 0.16; revisit at the next uniffi release.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: build-time template config of uniffi's bindings generator, in no shipped binary" },
    # webpki-roots 0.26.11 (sqlx-core's dependency) holds no roots of its own:
    # it re-exports webpki-roots 1.x, which the lock pins at the fixed 1.0.10
    # (`cargo tree -p webpki-roots@0.26.11`). The advisory matches the shim's
    # version number only. Drop this when sqlx moves to webpki-roots 1.
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 is a shim re-exporting the fixed 1.0.10" },
]

[licenses]
# Everything Kutup links must be compatible with its AGPL-3.0-only.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The repository's own unpublished crates (the fuzz targets carry no licence).
ignore = true

[bans]
# Duplicate versions are reported, not refused: most come from libsignal's and
# OpenMLS's exact pins.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/signalapp/libsignal",
    "https://github.com/signalapp/SparsePostQuantumRatchet.git",
]
