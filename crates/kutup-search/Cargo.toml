[package]
name = "kutup-search"
description = "Kutup's word index: Turkish-aware folding and a period-sharded inverted index over sealed records"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
ciborium = "0.2"
unicode-normalization.workspace = true
thiserror.workspace = true

[features]
# In a browser build (wasm32), fold through the browser's own Unicode
# normalization (String.prototype.normalize) instead of compiling the NFKD
# tables in: about 80 KB less for the Pass WASM. Native builds keep the
# tables whatever the feature says.
# ONLY for an index built and queried in the same browser: never for the
# server's keyed search tokens or any hash, index or record another machine
# folds again (the browser's Unicode version is its own). The crates that may
# turn it on are listed in scripts/check-browser-fold.py (the static gate).
browser = ["dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
serde_json.workspace = true
