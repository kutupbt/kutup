[package]
name = "kutup-crypto"
description = "Canonical shared E2EE implementation for Kutup clients"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["mnemonic"]
mnemonic = ["dep:bip39"]
# OpenPGP mail address keys (`mail_key`); off for clients that do not need rPGP (Chat).
mail = ["dep:pgp", "dep:rand"]

[dependencies]
dryoc.workspace = true
hkdf.workspace = true
hmac.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
bip39 = { workspace = true, optional = true }
thiserror.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true
hpke-rs = { version = "=0.6.1" }
hpke-rs-rust-crypto = { version = "=0.6.1" }
# OpenPGP for mail (docs/cryptographic-dependencies.md). No bzip2: it needs C.
pgp = { version = "=0.21.0", default-features = false, optional = true }
rand = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser clock and randomness for rPGP's signature timestamps.
pgp = { version = "=0.21.0", default-features = false, features = ["wasm"], optional = true }

[dev-dependencies]
serde.workspace = true
hex.workspace = true

[[test]]
name = "mail_key_vectors"
required-features = ["mail"]

[[test]]
name = "mail_key_gnupg"
required-features = ["mail"]
