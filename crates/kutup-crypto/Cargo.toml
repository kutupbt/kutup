[package]
name = "kutup-crypto"
description = "Canonical shared E2EE implementation for Kutup clients"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["mnemonic"]
mnemonic = ["dep:bip39"]
# OpenPGP mail address keys (`mail_key`); off for clients that do not need rPGP (Chat).
mail = ["dep:pgp", "dep:rand", "dep:rsa"]
# Builders of malformed values for negative vectors; on for this crate's own
# tests only (the dev-dependency on itself below), never for a client.
test-vectors = []

[dependencies]
dryoc.workspace = true
hkdf.workspace = true
hmac.workspace = true
unicode-normalization.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
bip39 = { workspace = true, optional = true }
thiserror.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true
hpke-rs = { version = "=0.6.1" }
# `experimental` is hpke-rs's name for its post-quantum KEMs: the groups'
# anonymous route (`oblivious`) uses X-Wing (X25519 + ML-KEM-768,
# draft-connolly-cfrg-xwing-kem-06, codepoint 0x647a) through RustCrypto's
# released x-wing 0.1 and ml-kem 0.3.
hpke-rs-rust-crypto = { version = "=0.6.1", features = ["experimental"] }
# Pinned to the releases, so a later resolve can't pick up a release
# candidate (hpke-rs-rust-crypto 0.6.1 asks for ^0.1.0-rc.0 / ^0.3.0-rc.0).
x-wing = { version = "=0.1.1", features = ["zeroize"] }
ml-kem = { version = "=0.3.3" }
# OPAQUE sign-in (docs/plans/opaque.md): RFC 9807, ristretto255 + 3DH. The KSF
# is ours (Argon2id at the V1 cost, through dryoc), so no `argon2` feature.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
# OpenPGP for mail (docs/cryptographic-dependencies.md). No bzip2: it needs C.
# `draft-wussler-openpgp-forwarding`: Proton-style end-to-end forwarding
# (`mail_forwarding`); it adds no dependency.
pgp = { version = "=0.21.0", default-features = false, features = ["draft-wussler-openpgp-forwarding"], optional = true }
rand = { workspace = true, optional = true }
# Only for an RSA key's size in the key table; the same version rPGP uses.
rsa = { version = "=0.9.10", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser clock and randomness for rPGP's signature timestamps.
pgp = { version = "=0.21.0", default-features = false, features = ["wasm", "draft-wussler-openpgp-forwarding"], optional = true }

[dev-dependencies]
rand_chacha = "0.3"
kutup-crypto = { path = ".", features = ["test-vectors"] }
serde.workspace = true
hex.workspace = true
uuid.workspace = true

[[test]]
name = "mail_key_vectors"
required-features = ["mail"]

[[test]]
name = "mail_key_gnupg"
required-features = ["mail"]

[[test]]
name = "mail_arrival_vectors"
required-features = ["mail"]

[[test]]
name = "mail_split_vectors"
required-features = ["mail"]

[[test]]
name = "mail_group_share_vectors"
required-features = ["mail"]

[[test]]
name = "group_pins_with_chains"
required-features = ["mail"]

[[test]]
name = "mail_group_chain_vectors"
required-features = ["mail"]

[[test]]
name = "mail_pgp_gnupg"
required-features = ["mail"]
