[package]
name = "kutup-crypto"
description = "Canonical shared E2EE implementation for Kutup clients"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["mnemonic"]
mnemonic = ["dep:bip39"]

[dependencies]
dryoc.workspace = true
hkdf.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
bip39 = { workspace = true, optional = true }
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true
hex.workspace = true
hpke-rs = { version = "=0.6.1" }
hpke-rs-rust-crypto = { version = "=0.6.1" }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
