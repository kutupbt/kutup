[package]
name = "kutup-mail-search-wasm"
description = "Browser bindings for Mail's search index: the word index over sealed records"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The browser fold: its index is built and queried in this browser only
# (sealed in IndexedDB, docs/plans/mail-body-search.md).
kutup-search = { path = "../kutup-search", features = ["browser"] }
kutup-crypto = { path = "../kutup-crypto", default-features = false }
serde.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
