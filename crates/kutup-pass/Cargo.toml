[package]
name = "kutup-pass"
description = "Kutup Pass core: KeePass (KDBX) vaults and their three-way merge"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The patched copy of the `keepass` crate (vendor/keepass/KUTUP.md).
keepass = { path = "vendor/keepass", features = ["save_kdbx4", "totp"] }
# Kept vault keys (kept.rs) use the account envelope format.
kutup-crypto = { path = "../kutup-crypto" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid.workspace = true
thiserror.workspace = true
zeroize.workspace = true
serde.workspace = true
base64.workspace = true
# SSH keys kept in vault entries (KeeAgent), for the `kutup` agent.
ssh-key = { version = "0.6", features = ["std", "ed25519", "rsa", "p256", "p384", "encryption"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2.workspace = true
quick-xml = "0.42"
# Random key files (kdbx::generate_key_file); in the browser through
# kutup-pass-wasm's `wasm_js` backend.
getrandom = "0.3"
hex = "0.4"
# Other password managers' exports (import.rs).
csv = "1"
serde_json.workspace = true
signature = "2"
ssh-encoding = { version = "0.2", features = ["alloc"] }
# The Argon2 version of new vaults' key derivation (the `keepass` crate's).
argon2 = { package = "rust-argon2", version = "3" }

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
# Test keys are made at test time, never checked in.
ssh-key = { version = "0.6", features = ["std", "ed25519", "rsa", "p256", "p384", "encryption", "rand_core", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# The `vault` example stamps edits with the current time.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
