[package]
name = "kutup-pass"
description = "Kutup Pass core: KeePass (KDBX) vaults and their three-way merge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The patched copy of the `keepass` crate (vendor/keepass/KUTUP.md).
keepass = { path = "vendor/keepass", features = ["save_kdbx4", "totp"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid.workspace = true
thiserror.workspace = true
zeroize.workspace = true
sha2.workspace = true
serde.workspace = true
base64.workspace = true
# The Argon2 version of new vaults' key derivation (the `keepass` crate's).
argon2 = { package = "rust-argon2", version = "3" }

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
# The `vault` example stamps edits with the current time.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
