[package]
name = "kutup-crypto-wasm"
description = "Thin browser bindings for the canonical kutup-crypto implementation"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Calendars (docs/plans/calendar.md): built as a second runtime,
# `crypto-calendar`, which the Calendar app (and Mail for invitations) loads
# instead of `crypto`, so no other app carries the time zone database.
calendar = ["kutup-crypto/calendar"]

[dependencies]
kutup-crypto = { path = "../kutup-crypto", features = ["mail"] }
kutup-chat-proto = { path = "../kutup-chat-proto" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
zeroize.workspace = true
hex.workspace = true
uuid.workspace = true
ed25519-dalek.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { workspace = true, features = ["js"] }
