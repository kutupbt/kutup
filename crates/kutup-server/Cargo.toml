[package]
name = "kutup-server"
description = "kutup backend API — Axum + sqlx (end-to-end encrypted file storage)."
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kutup-server"
path = "src/main.rs"

[dependencies]
kutup-chat-proto = { path = "../kutup-chat-proto", features = ["openapi"] }
kutup-federation-proto = { path = "../kutup-federation-proto", features = ["openapi"] }
kutup-crypto = { path = "../kutup-crypto", features = ["mail"] }
# Readable headers of incoming mail (Stalwart's own parser), docs/plans/mail.md.
mail-parser = { version = "=0.11.9", default-features = false }
axum.workspace = true
tokio.workspace = true
sqlx.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
utoipa.workspace = true
jsonwebtoken.workspace = true
# VAPID signatures (ES256) for Web Push wake-ups.
p256 = { workspace = true, features = ["ecdsa"] }
# coturn shared-secret TURN credentials for Chat calls.
hmac = "0.12"
sha1 = "0.10"
bcrypt.workspace = true
totp-rs.workspace = true
url.workspace = true
sha2.workspace = true
hkdf.workspace = true
hex.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
aws-credential-types.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tempfile.workspace = true
multer.workspace = true
# Unified federation transport and storage capacity probe.
reqwest.workspace = true
rustls.workspace = true
rand.workspace = true
rand09 = { package = "rand", version = "0.9" }
# Direct use of the pinned libsignal sealed-sender certificate primitives. The
# offline root is never configured here; only a root-signed server certificate
# and its online private key are loaded by the service.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.97.2" }
# The OPAQUE setup keys are wiped from memory when dropped.
zeroize.workspace = true

[dev-dependencies]
# A local TLS server for the post-quantum handshake test (src/tls.rs).
tokio-rustls = { version = "0.26", default-features = false }
# The collaboration socket in live tests (tests/collab_frames_live.rs); the
# version axum's own WebSocket support already brings.
tokio-tungstenite = "0.24.0"
# Suite-1 (X25519) Drive keys as accounts had them before X-Wing, made in
# tests/identity_suite_live.rs to test the upgrade.
dryoc.workspace = true
