[package]
name = "kutup-cli"
description = "kutup CLI — E2E encrypted file storage client."
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kutup"
path = "src/main.rs"

[dependencies]
kutup-crypto = { path = "../kutup-crypto", features = ["mail"] }
kutup-collab = { path = "../kutup-collab" }
ed25519-dalek.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true
dirs.workspace = true
redb.workspace = true
rpassword.workspace = true
rand.workspace = true
sha2.workspace = true
indicatif.workspace = true
mime_guess.workspace = true
qrcode.workspace = true
time.workspace = true
notify.workspace = true
url.workspace = true
uuid.workspace = true
hex.workspace = true
kutup-pass = { path = "../kutup-pass" }
ssh-key = { version = "0.6", features = ["std", "ed25519", "rsa", "p256", "p384", "encryption"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# The SSH agent asks the system who connected (docs/plans/pass.md, K3b).
libc = "0.2"

# OS keychain only where it needs no C deps (Linux uses the file fallback).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring.workspace = true

[dev-dependencies]
# Agent tests make their keys at run time.
ssh-key = { version = "0.6", features = ["std", "ed25519", "rand_core", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tempfile.workspace = true

[features]
# Test-only interruption hook: KUTUP_TEST_ABORT_AFTER_PATCHES=N makes an
# upload exit(74) after N tus PATCHes (e2e resume scripts build with this).
fail-inject = []
