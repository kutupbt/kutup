services:
  postgres:
    ports:
      - "127.0.0.1:${KUTUP_BACKUP_DB_PORT:-39084}:5432"
  seaweedfs-s3:
    ports:
      - "127.0.0.1:${KUTUP_BACKUP_S3_PORT:-39085}:8333"
  backend:
    ports:
      - "127.0.0.1:${KUTUP_BACKUP_TEST_PORT:-39083}:3000"
    environment:
      # Meetings by link (call_links_live). No SFU runs: the tests only mint
      # tokens, and `.invalid` never resolves.
      CHAT_SFU_URL: ws://sfu.invalid
      CHAT_SFU_API_KEY: backup-test-sfu-key
      CHAT_SFU_API_SECRET: backup-test-sfu-secret-at-least-32-characters
