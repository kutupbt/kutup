services:
  seaweedfs-master:
    volumes:
      - type: bind
        source: ${KUTUP_E2E_DATA_DIR:?Set KUTUP_E2E_DATA_DIR to a disposable directory}/seaweedfs-master
        target: /data

  seaweedfs-volume:
    volumes:
      - type: bind
        source: ${KUTUP_E2E_DATA_DIR:?Set KUTUP_E2E_DATA_DIR to a disposable directory}/seaweedfs-volume
        target: /data

  # A suite run creates dozens of accounts from one address. Production limits
  # stay in nginx (the fixtures wait them out); the backend's own per-address
  # ceilings are raised as in docker-compose.chat-federation.yml.
  backend:
    environment:
      RATE_LIMIT_LOGIN_PER_MIN: 1000
      # Outside sending on at first, for spec 58's pause notice (no Stalwart
      # here); spec 59 turns it off and back on in Administration → Mail sending.
      MAIL_OUTSIDE_SENDING: ${MAIL_OUTSIDE_SENDING:-on}
      RATE_LIMIT_PREFLIGHT_PER_MIN: 1000
      RATE_LIMIT_REGISTER_PER_HOUR: 1000
      RATE_LIMIT_CHAT_KEYS_PER_MIN: 1000
      RATE_LIMIT_CHAT_KEYS_IP_PER_MIN: 1000
      # Every page checks who shared what (docs/plans/drive-identity-pins.md).
      RATE_LIMIT_USER_LOOKUP_PER_MIN: 1000
      # The break-glass administrator for admin specs (fixtures/apps.ts,
      # signInAsAdmin); its first sign-in replaces this temporary password.
      ADMIN_ACCOUNT: admin@kutup.dev:admin:Bootstrap*Temporary123
