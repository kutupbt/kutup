name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format-and-fuzz:
    name: Formatting and fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Compose S3 credential wiring
        run: python3 scripts/test-compose-s3-credentials.py
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: security-fuzz
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/kutup-chat-core/Cargo.toml -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Compile all parser fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets

  chat-core:
    name: Chat core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chat-core
          workspaces: crates/kutup-chat-core -> crates/kutup-chat-core/target
      - name: Run standalone Chat core tests
        run: cargo test --locked --manifest-path crates/kutup-chat-core/Cargo.toml --all-targets

  web:
    name: Web, WASM, and frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chat-wasm
          workspaces: crates/kutup-chat-core -> crates/kutup-chat-core/target
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile
      - name: Build WASM modules
        run: pnpm -C frontend run build:wasm
      - name: Run frontend tests
        run: pnpm -C frontend exec vitest run --reporter=dot
      - name: Verify generated crypto WASM vectors
        run: pnpm -C frontend run test:crypto-wasm
      - name: Check the Kutup Pass WASM module
        run: pnpm -C frontend run test:pass-wasm
      - name: Build production web app
        run: pnpm -C frontend run build

  chat-backup-integration:
    name: Chat backup lifecycle (Postgres and SeaweedFS)
    # A dependency bump gets the unit and build checks; the stack-level gates
    # run when it reaches master.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: chat-backup-integration
      - name: Run isolated live backup lifecycle
        run: scripts/test-chat-backup-integration.sh

  chat-backup-browser:
    name: Clean-browser Chat backup recovery
    # The browser gates build the whole stack and take the longest. They run
    # on master and on demand (Actions → CI → Run workflow, on any branch);
    # before a pull request they are run locally (docs/contributing.md).
    if: github.event_name != 'pull_request'
    needs:
      - rust-workspace
      - web
      - chat-backup-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KUTUP_E2E_SAFE_ARTIFACTS: "1"
      KUTUP_E2E_DIAGNOSTICS_DIR: sanitized-results
      POSTGRES_PASSWORD: chat-backup-ci-postgres
      JWT_SECRET: chat-backup-ci-jwt-secret-at-least-32-bytes
      APP_ENV: test
      # The batch registers more test accounts than the default ten an hour
      # from one address allows (spec 40's last test was refused since #60).
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      # One app per hostname; *.localhost resolves to this machine.
      KUTUP_ACCOUNT_URL: https://account.localhost:38443
      KUTUP_DRIVE_URL: https://drive.localhost:38443
      KUTUP_CHAT_URL: https://chat.localhost:38443
      KUTUP_OFFICE_URL: https://office.localhost:38443
      KUTUP_EDITOR_URL: https://editor.localhost:38443
      KUTUP_MAPS_URL: https://maps.localhost:38443
      KUTUP_PHOTOS_URL: https://photos.localhost:38443
      KUTUP_CONTACTS_URL: https://contacts.localhost:38443
      KUTUP_MAIL_URL: https://mail.localhost:38443
      KUTUP_PASS_URL: https://pass.localhost:38443
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install browser test dependencies
        run: npm ci --prefix tests/e2e
      - name: Install Chromium
        run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Generate ephemeral browser-test TLS certificate
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,DNS:account.localhost,DNS:drive.localhost,DNS:chat.localhost,DNS:office.localhost,DNS:editor.localhost,DNS:maps.localhost,DNS:photos.localhost,DNS:contacts.localhost,DNS:mail.localhost,DNS:pass.localhost,IP:127.0.0.1
      # The image builds keep Cargo's registry and target directories in
      # BuildKit cache mounts, which a fresh runner starts without. Carry
      # them between runs so only changed crates compile. Never fatal: a
      # cache problem costs time, not the gate.
      - name: Restore image build caches
        id: image-build-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ci-docker-cache
          key: image-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/kutup-chat-core/Cargo.lock', 'Dockerfile.server', 'frontend/Dockerfile') }}
          restore-keys: |
            image-build-${{ runner.os }}-
      - name: Hand the caches to the image builder
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "ci-docker-cache/server-registry": { "target": "/usr/local/cargo/registry", "id": "kutup-server-cargo-registry" },
              "ci-docker-cache/server-target": { "target": "/build/target", "id": "kutup-server-release-target" },
              "ci-docker-cache/browser-registry": { "target": "/usr/local/cargo/registry", "id": "kutup-browser-cargo-registry" },
              "ci-docker-cache/browser-git": { "target": "/usr/local/cargo/git", "id": "kutup-browser-cargo-git" },
              "ci-docker-cache/browser-target": { "target": "/src/target", "id": "kutup-browser-root-target" },
              "ci-docker-cache/browser-chat-target": { "target": "/src/crates/kutup-chat-core/target", "id": "kutup-browser-chat-target" }
            }
          skip-extraction: ${{ steps.image-build-cache.outputs.cache-hit }}
      - name: Start the single-server stack
        run: docker compose up --detach --build --wait
      - name: Wait for the browser application route
        run: |
          curl --fail --silent --show-error --insecure \
            --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors \
            https://localhost:38443/api/auth/settings >/dev/null
          curl --fail --silent --show-error --insecure \
            --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors \
            --resolve account.localhost:38443:127.0.0.1 \
            https://account.localhost:38443/register >/dev/null
      - name: Run clean-browser recovery
        working-directory: tests/e2e
        run: npm exec -- playwright test specs/33-chat-history-recovery.spec.ts specs/36-chat-local-groups.spec.ts specs/38-chat-group-device-replaced.spec.ts specs/40-chat-open-failures.spec.ts specs/90-load-retries.spec.ts --project=chromium
      - name: Collect sanitized backup diagnostics
        if: failure()
        run: scripts/collect-chat-e2e-diagnostics.sh single
      - name: Stop the single-server stack
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload clean-browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chat-backup-browser-results
          if-no-files-found: ignore
          retention-days: 14
          path: tests/e2e/sanitized-results/**

  mail-browser:
    name: Mail browser specs
    # The Mail, Contacts and Pass browser lines on their own stack, beside the
    # Chat gate; like it, on master and on demand only.
    if: github.event_name != 'pull_request'
    needs:
      - rust-workspace
      - web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KUTUP_E2E_SAFE_ARTIFACTS: "1"
      KUTUP_E2E_DIAGNOSTICS_DIR: sanitized-results
      POSTGRES_PASSWORD: mail-browser-ci-postgres
      JWT_SECRET: mail-browser-ci-jwt-secret-at-least-32-bytes
      APP_ENV: test
      # The batch registers more test accounts than the default ten an hour
      # from one address allows.
      RATE_LIMIT_REGISTER_PER_HOUR: "100"
      # The Mail specs: the test administrator (tests/e2e/fixtures/apps.ts)
      # and outside sending on for spec 58's pause notice; spec 59 turns it
      # off in Administration and back on (tests/e2e/README.md).
      ADMIN_ACCOUNT: "admin@kutup.dev:admin:Bootstrap*Temporary123"
      MAIL_OUTSIDE_SENDING: "on"
      # Sends go at once in the browser specs; spec 102 turns undo send on.
      MAIL_DEFAULT_DELAY_SEND_SECONDS: "0"
      # One app per hostname; *.localhost resolves to this machine.
      KUTUP_ACCOUNT_URL: https://account.localhost:38443
      KUTUP_DRIVE_URL: https://drive.localhost:38443
      KUTUP_CHAT_URL: https://chat.localhost:38443
      KUTUP_OFFICE_URL: https://office.localhost:38443
      KUTUP_EDITOR_URL: https://editor.localhost:38443
      KUTUP_MAPS_URL: https://maps.localhost:38443
      KUTUP_PHOTOS_URL: https://photos.localhost:38443
      KUTUP_CONTACTS_URL: https://contacts.localhost:38443
      KUTUP_MAIL_URL: https://mail.localhost:38443
      KUTUP_PASS_URL: https://pass.localhost:38443
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install browser test dependencies
        run: npm ci --prefix tests/e2e
      - name: Install Chromium
        run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Generate ephemeral browser-test TLS certificate
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,DNS:account.localhost,DNS:drive.localhost,DNS:chat.localhost,DNS:office.localhost,DNS:editor.localhost,DNS:maps.localhost,DNS:photos.localhost,DNS:contacts.localhost,DNS:mail.localhost,DNS:pass.localhost,IP:127.0.0.1
      # The image builds keep Cargo's registry and target directories in
      # BuildKit cache mounts, which a fresh runner starts without. Carry
      # them between runs so only changed crates compile. Never fatal: a
      # cache problem costs time, not the gate.
      - name: Restore image build caches
        id: image-build-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ci-docker-cache
          key: image-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/kutup-chat-core/Cargo.lock', 'Dockerfile.server', 'frontend/Dockerfile') }}
          restore-keys: |
            image-build-${{ runner.os }}-
      - name: Hand the caches to the image builder
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "ci-docker-cache/server-registry": { "target": "/usr/local/cargo/registry", "id": "kutup-server-cargo-registry" },
              "ci-docker-cache/server-target": { "target": "/build/target", "id": "kutup-server-release-target" },
              "ci-docker-cache/browser-registry": { "target": "/usr/local/cargo/registry", "id": "kutup-browser-cargo-registry" },
              "ci-docker-cache/browser-git": { "target": "/usr/local/cargo/git", "id": "kutup-browser-cargo-git" },
              "ci-docker-cache/browser-target": { "target": "/src/target", "id": "kutup-browser-root-target" },
              "ci-docker-cache/browser-chat-target": { "target": "/src/crates/kutup-chat-core/target", "id": "kutup-browser-chat-target" }
            }
          skip-extraction: ${{ steps.image-build-cache.outputs.cache-hit }}
      - name: Start the single-server stack
        run: docker compose up --detach --build --wait
      - name: Wait for the browser application route
        run: |
          curl --fail --silent --show-error --insecure \
            --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors \
            https://localhost:38443/api/auth/settings >/dev/null
          curl --fail --silent --show-error --insecure \
            --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors \
            --resolve account.localhost:38443:127.0.0.1 \
            https://account.localhost:38443/register >/dev/null
      - name: Run the Mail browser specs
        working-directory: tests/e2e
        run: npm exec -- playwright test specs/54-mail-address-keys.spec.ts specs/57-mail.spec.ts specs/58-mail-sending-safety.spec.ts specs/59-mail-outside-off.spec.ts specs/60-mail-groups.spec.ts specs/80-mail-people.spec.ts specs/81-mail-list.spec.ts specs/82-mail-folders-labels.spec.ts specs/83-mail-filters.spec.ts specs/84-mail-block-allow.spec.ts specs/85-mail-settings-empty.spec.ts specs/86-mail-encrypt-sign.spec.ts specs/87-mail-identity.spec.ts specs/88-mail-auto-reply.spec.ts specs/89-mail-appearance.spec.ts specs/91-mail-pgp-settings.spec.ts specs/92-contact-keys.spec.ts specs/93-mail-list-filters.spec.ts specs/94-mail-message-tools.spec.ts specs/95-mail-link-confirm.spec.ts specs/96-mail-attachments.spec.ts specs/97-mail-paging.spec.ts specs/98-mail-select-all.spec.ts specs/99-mail-one-time-code.spec.ts specs/100-mail-read-receipts.spec.ts specs/101-mail-remote-images.spec.ts specs/102-mail-undo-send.spec.ts specs/103-mail-scheduled-send.spec.ts specs/104-mail-snooze.spec.ts specs/105-mail-composer-format.spec.ts specs/106-mail-images-emoji.spec.ts --project=chromium
      - name: Run the Contacts browser specs
        working-directory: tests/e2e
        run: npm exec -- playwright test specs/55-contacts.spec.ts specs/56-contact-pickers.spec.ts specs/74-contact-shields.spec.ts --project=chromium
      - name: Run the Pass browser specs
        working-directory: tests/e2e
        run: npm exec -- playwright test specs/76-pass-vault.spec.ts specs/77-pass-merge.spec.ts specs/78-pass-offline.spec.ts specs/79-pass-unlock.spec.ts --project=chromium
      - name: Collect sanitized diagnostics
        if: failure()
        run: scripts/collect-chat-e2e-diagnostics.sh single
      - name: Stop the single-server stack
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload Mail browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mail-browser-results
          if-no-files-found: ignore
          retention-days: 14
          path: tests/e2e/sanitized-results/**

  mail-gate:
    name: Mail gate (Stalwart, SMTP, GnuPG)
    # A real Stalwart in front of the backend (scripts/test-mail-inbound.sh):
    # inbound, end-to-end and outside sending, and PGP/MIME GnuPG opens.
    # On master and on demand only, like the browser gates.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler and GnuPG
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler gnupg
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mail-gate
      # Stalwart's set-up reads the stack's certificate.
      - name: Generate ephemeral TLS certificate
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -subj /CN=mail.kutup.test \
            -addext subjectAltName=DNS:mail.kutup.test,DNS:localhost,IP:127.0.0.1
      # The backend image's Cargo caches, carried between runs as the
      # browser gates do. Never fatal.
      - name: Restore image build caches
        id: image-build-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ci-docker-cache
          key: mail-gate-image-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Dockerfile.server') }}
          restore-keys: |
            mail-gate-image-${{ runner.os }}-
      - name: Hand the caches to the image builder
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "ci-docker-cache/server-registry": { "target": "/usr/local/cargo/registry", "id": "kutup-server-cargo-registry" },
              "ci-docker-cache/server-target": { "target": "/build/target", "id": "kutup-server-release-target" }
            }
          skip-extraction: ${{ steps.image-build-cache.outputs.cache-hit }}
      - name: Run the mail gate
        run: scripts/test-mail-inbound.sh

  chat-security-e2e:
    name: Two-server browser security
    # The browser gates build the whole stack and take the longest. They run
    # on master and on demand (Actions → CI → Run workflow, on any branch);
    # before a pull request they are run locally (docs/contributing.md).
    if: github.event_name != 'pull_request'
    needs:
      - format-and-fuzz
      - rust-workspace
      - chat-core
      - web
      - chat-backup-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KUTUP_E2E_SAFE_ARTIFACTS: "1"
      KUTUP_E2E_DIAGNOSTICS_DIR: sanitized-results
    steps:
      - uses: actions/checkout@v7
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: security-e2e-host
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install browser test dependencies
        run: npm ci --prefix tests/e2e
      - name: Install Chromium
        run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Verify Docker Compose
        run: docker compose version
      # The image builds keep Cargo's registry and target directories in
      # BuildKit cache mounts, which a fresh runner starts without. Carry
      # them between runs so only changed crates compile. Never fatal: a
      # cache problem costs time, not the gate.
      - name: Restore image build caches
        id: image-build-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ci-docker-cache
          key: image-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/kutup-chat-core/Cargo.lock', 'Dockerfile.server', 'frontend/Dockerfile') }}
          restore-keys: |
            image-build-${{ runner.os }}-
      - name: Hand the caches to the image builder
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "ci-docker-cache/server-registry": { "target": "/usr/local/cargo/registry", "id": "kutup-server-cargo-registry" },
              "ci-docker-cache/server-target": { "target": "/build/target", "id": "kutup-server-release-target" },
              "ci-docker-cache/browser-registry": { "target": "/usr/local/cargo/registry", "id": "kutup-browser-cargo-registry" },
              "ci-docker-cache/browser-git": { "target": "/usr/local/cargo/git", "id": "kutup-browser-cargo-git" },
              "ci-docker-cache/browser-target": { "target": "/src/target", "id": "kutup-browser-root-target" },
              "ci-docker-cache/browser-chat-target": { "target": "/src/crates/kutup-chat-core/target", "id": "kutup-browser-chat-target" }
            }
          skip-extraction: ${{ steps.image-build-cache.outputs.cache-hit }}
      - name: Run two-server federation and browser gate
        run: scripts/test-chat-federation.sh
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chat-security-playwright-results
          if-no-files-found: ignore
          retention-days: 14
          path: tests/e2e/sanitized-results/**
