worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting zones.
    # `auth` is intentionally aggressive — login/register/recover are
    # credential-facing and 10/min per IP is plenty.
    # `api` is a per-address flood wall, not a usage budget. One address is
    # often a whole household or office behind NAT, each person with several
    # apps open: a Chat client alone makes ~60 requests while it starts, and
    # Photos fetches one thumbnail per request while scrolling. At 10r/s with
    # a burst of 100, two people opening Chat together already had sends
    # refused. Sensitive endpoints keep their own per-account and per-address
    # limits in the backend (RATE_LIMIT_* in .env.example).
    # 429, not nginx's default 503: the apps tell people to wait on 429
    # ("Too many attempts") and treat 503 as the server being down.
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=50r/s;

    # Map HTTP Connection header for WebSocket upgrade. "upgrade" if the client
    # sent Upgrade: websocket, otherwise empty so we don't break keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP → HTTPS redirect. Browser users typing http:// get bumped up.
    server {
        listen 80;
        server_name _;

        # Let's Encrypt's ownership check, when certificates are automatic
        # (docker-compose.acme.yml). Without it the directory does not exist
        # and this answers 404.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server (the only end-user surface).
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Use Docker's embedded DNS so upstreams resolve lazily at request time,
        # not at nginx startup (avoids "host not found" crash when containers start).
        resolver 127.0.0.11 valid=5s;
        set $backend  "http://backend:3000";
        set $frontend "http://frontend:80";

        # Security headers common to every host. Each web app's own policy
        # (Content-Security-Policy, framing) comes from the frontend container,
        # which knows the app hostnames (frontend/docker/40-kutup-hosts.sh):
        # Drive frames the editor sandbox, which is a different origin, so one
        # site-wide policy here would block every office document.
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 10G;

        # Collab WebSockets: /api/files/:fileId/collab/ws, and the routes for
        # files on other servers (docs/plans/collab-federation.md).
        # MUST be matched before the general /api/ block.
        location ~ ^/api/(files/[^/]+|drive/federation/shares/[^/]+/files/[^/]+|drive/federation/file-shares/[^/]+)/collab/ws$ {
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Long timeouts for live editing sessions.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Chat WebSocket: /api/chat/ws (mailbox push stream)
        # MUST be matched before the general /api/ block.
        location = /api/chat/ws {
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Long-lived messaging sessions.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Login/recovery preflight has an independent server-side 20/min/IP
        # limiter. Do not also spend the much smaller credential-attempt
        # bucket while a browser is deriving its password key.
        location ~ ^/api/auth/(login|recovery)/preflight$ {
            limit_req zone=api burst=500 nodelay;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # Credential-bearing auth endpoints — stricter rate limiting
        location ~ ^/api/auth/(login|register|recover) {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # API proxy
        location /api/ {
            limit_req zone=api burst=500 nodelay;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # OpenAPI spec (utoipa) — /api-docs/ is outside the /api/ prefix.
        location /api-docs/ {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
        }

        # Federation discovery is rooted outside /api so a canonical
        # username@server does not expose deployment topology or port choices.
        # The prefix covers the discovery document and the identity history
        # beside it (federation/identity/<n>.json), which peers read after a
        # key rotation.
        location /.well-known/kutup/ {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Frontend SPA
        location / {
            proxy_pass $frontend$request_uri;
            proxy_set_header Host $host;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass $frontend$request_uri;
            proxy_set_header Host $host;
        }
    }

    # The group-call SFU (LiveKit, `docker compose --profile sfu`), reached
    # by browsers as wss://sfu.<domain> (CHAT_SFU_URL). LiveKit runs on the
    # host network, so this goes to the host's port 7880. Declared after the
    # server above, which stays the default for every other name.
    server {
        listen 443 ssl;
        http2 on;
        server_name ~^sfu\.;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://host.docker.internal:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # A call's signalling socket stays open for the whole call.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
