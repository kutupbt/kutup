worker_processes auto;
# Each proxied TLS WebSocket (Chat, live editing, calls) holds about four
# connections here: client to stream, stream to the HTTPS server, and on to
# the backend. 1024 ran out at a few hundred open sockets.
worker_rlimit_nofile 65535;
events { worker_connections 16384; }

# Port 443 is shared by the web apps and the call relays, so that a call
# works on a network that lets nothing out but HTTPS. The name the client
# asks for (SNI) is read without decrypting anything, and the connection is
# handed on:
#
#   turn.<domain>      the TURN relay for 1:1 calls (coturn), as TURN over TLS
#   sfu-turn.<domain>  the group-call server's own relay (LiveKit)
#   anything else      the web apps and the API, below
#
# The relays speak plain TCP on the host; TLS for them ends here, with the
# same certificate (the two names must be on it: KUTUP_ACME_EXTRA_DOMAINS).
# A deployment without calls is unaffected: nothing asks for those names.
# The PROXY protocol carries the visitor's address on to the web server, so
# rate limits and logs still see who is calling.
stream {
    map $ssl_preread_server_name $kutup_front {
        ~^turn\.      127.0.0.1:8444;
        ~^sfu-turn\.  127.0.0.1:8445;
        default       127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $kutup_front;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # Uploads, live editing and calls hold a connection for a long time.
        proxy_timeout 1h;
    }

    server {
        listen 127.0.0.1:8444 ssl proxy_protocol;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # coturn's TCP listener (docker-compose.yml, profile `turn`).
        proxy_pass host.docker.internal:3478;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }

    server {
        listen 127.0.0.1:8445 ssl proxy_protocol;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # LiveKit's TURN listener (profile `sfu`, CHAT_SFU_TURN_DOMAIN).
        proxy_pass host.docker.internal:5349;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    # No nginx version in the Server header or on error pages.
    server_tokens off;
    # Resumption comes from the session cache below; tickets are off because
    # their key changes only when nginx reloads, which weakens forward
    # secrecy for every session it protects.
    ssl_session_tickets off;
    # One cache for every HTTPS server on the listener (the apps and the
    # SFU), as nginx advises for servers that share one.
    ssl_session_cache shared:kutup_tls:10m;
    ssl_session_timeout 1d;
    # TLS 1.2 keeps to forward-secret AEAD suites (TLS 1.3 has only those).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Request headers, decoded, may take at most 4 × 8 KiB: for HTTP/3 this
    # is also the whole budget a QPACK header block may expand to, however
    # its dynamic-table references multiply it (nginx's own default, stated
    # here so it is not raised by accident; see the QPACK amplification
    # attacks on HTTP/3 servers, 2026).
    large_client_header_buffers 4 8k;

    # Static files come from the frontend already compressed (gzip and
    # brotli, stored at build time); they pass through as they are. API
    # responses are compressed here, in /api/ below (docs/research/
    # 18-web-performance.md). Responses that already carry an encoding are
    # never compressed again.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Rate limiting zones.
    # `auth` is intentionally aggressive — login/register/recover are
    # credential-facing and 10/min per IP is plenty.
    # `api` is a per-address flood wall, not a usage budget. One address is
    # often a whole household or office behind NAT, each person with several
    # apps open: a Chat client alone makes ~60 requests while it starts, and
    # Photos fetches one thumbnail per request while scrolling. At 10r/s with
    # a burst of 100, two people opening Chat together already had sends
    # refused. Sensitive endpoints keep their own per-account and per-address
    # limits in the backend (RATE_LIMIT_* in .env.example).
    # 429, not nginx's default 503: the apps tell people to wait on 429
    # ("Too many attempts") and treat 503 as the server being down.
    # Every HTTPS connection arrives through the `stream` block above, which
    # says who the visitor is in the PROXY protocol header.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=50r/s;

    # Map HTTP Connection header for WebSocket upgrade. "upgrade" if the client
    # sent Upgrade: websocket, otherwise empty so we don't break keepalive.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP → HTTPS redirect. Browser users typing http:// get bumped up.
    server {
        listen 80;
        server_name _;

        # Let's Encrypt's ownership check, when certificates are automatic
        # (docker-compose.acme.yml). Without it the directory does not exist
        # and this answers 404.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server (the only end-user surface). TCP arrives through the
    # `stream` block above; HTTP/3 (QUIC) comes straight to UDP 443, so its
    # visitors' addresses need no PROXY header. Browsers learn of it from
    # Alt-Svc and fall back to TCP when UDP is blocked (the host firewall
    # must let UDP 443 in).
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        listen 443 quic reuseport;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Use Docker's embedded DNS so upstreams resolve lazily at request time,
        # not at nginx startup (avoids "host not found" crash when containers start).
        resolver 127.0.0.11 valid=5s;
        set $backend  "http://backend:3000";
        set $frontend "http://frontend:80";

        # Security headers common to every host. Each web app's own policy
        # (Content-Security-Policy, framing) comes from the frontend container,
        # which knows the app hostnames (frontend/docker/40-kutup-hosts.sh):
        # Drive frames the editor sandbox, which is a different origin, so one
        # site-wide policy here would block every office document.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # A request body is written to a temporary file before it is passed
        # on (the default request buffering), so a large limit here would let
        # anyone fill the disk without signing in. Bodies stay small
        # everywhere but /api/, which streams them to the backend
        # (proxy_request_buffering off) and has its own limits per account.
        client_max_body_size 1m;

        # Collab WebSockets: /api/files/:fileId/collab/ws, and the routes for
        # files on other servers (docs/plans/collab-federation.md).
        # MUST be matched before the general /api/ block.
        location ~ ^/api/(files/[^/]+|drive/federation/shares/[^/]+/files/[^/]+|drive/federation/file-shares/[^/]+)/collab/ws$ {
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Long timeouts for live editing sessions.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Chat WebSocket: /api/chat/ws (mailbox push stream)
        # MUST be matched before the general /api/ block.
        location = /api/chat/ws {
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Long-lived messaging sessions.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Chat provisioning WebSocket: /api/chat/provisioning (a new device
        # waiting to be linked, docs/plans/account-identity-key.md). The
        # server closes it when its link code expires and pings it meanwhile.
        # MUST be matched before the general /api/ block.
        location = /api/chat/provisioning {
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        # Credential-bearing auth endpoints — stricter rate limiting. Only the
        # requests that are attempts count: an OPAQUE sign-in start (each one
        # is a password guess against an account), a second factor, a sign-up,
        # a recovery (its grant; the preflight before it is no attempt). A
        # finish completes a start already counted, and a
        # registration start is no guess (without a grant it serves only a new
        # key binding); the server limits both itself (docs/plans/opaque.md).
        location ~ ^/api/auth/(login/start|login/2fa|register|recover/grant)$ {
            limit_req zone=auth burst=5 nodelay;
            error_page 429 = @rate_limited;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # API proxy. Listings are JSON of base64 envelopes: compressed here
        # (not on /api/auth/, which returns tokens beside what the request
        # sent).
        location /api/ {
            limit_req zone=api burst=500 nodelay;
            # Uploads (tus, Chat media, Mail attachments) stream through.
            client_max_body_size 10G;
            error_page 429 = @rate_limited;
            gzip on;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # OpenAPI spec (utoipa) — /api-docs/ is outside the /api/ prefix.
        location /api-docs/ {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Federation discovery is rooted outside /api so a canonical
        # username@server does not expose deployment topology or port choices.
        # The prefix covers the discovery document and the identity history
        # beside it (federation/identity/<n>.json), which peers read after a
        # key rotation.
        location /.well-known/kutup/ {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # RFC 9116 security.txt, naming security@<server name>.
        location = /.well-known/security.txt {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Web Key Directory: outside OpenPGP clients find name@<server name>'s
        # mail key here (docs/plans/mail-address-keys.md).
        location /.well-known/openpgpkey/ {
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Frontend SPA. HTTP/1.1, so the frontend serves its stored gzip and
        # brotli copies (and Accept-Encoding passes through as it is).
        location / {
            proxy_pass $frontend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        # nginx's own 429 says which limit, as the backend's do: this address
        # asked too often (`rateLimited`), not the account's lockout. The
        # backend's own 429s pass through untouched (no proxy_intercept_errors).
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"too many requests","code":"rateLimited"}';
        }

        location @fallback {
            proxy_pass $frontend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }

    # The group-call SFU (LiveKit, `docker compose --profile sfu`), reached
    # by browsers as wss://sfu.<domain> (CHAT_SFU_URL). LiveKit runs on the
    # host network, so this goes to the host's port 7880. Declared after the
    # server above, which stays the default for every other name.
    server {
        listen 127.0.0.1:8443 ssl proxy_protocol;
        # A browser may reuse an HTTP/3 connection for this name too; it
        # must land here, not in the server above.
        listen 443 quic;
        http2 on;
        server_name ~^sfu\.;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://host.docker.internal:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # A call's signalling socket stays open for the whole call.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
