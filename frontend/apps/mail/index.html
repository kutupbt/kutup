<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Kutup Mail</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // No-flash theme: mirror next-themes (storage key kutup-theme) before
      // first paint. A stored light/dark wins; otherwise follow the OS.
      (function () {
        var p; try { p = localStorage.getItem('kutup-theme'); } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
