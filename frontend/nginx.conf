server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # wasm-bindgen emits stable filenames. Revalidate the glue and binary on
    # every page load so a deployment can never combine an old Rust ABI with a
    # new Vite bundle or API server.
    location ^~ /chat-wasm/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /crypto-wasm/ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite content-hashed assets can be cached permanently.
    location ~* \.(js|css|wasm|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all non-asset paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
