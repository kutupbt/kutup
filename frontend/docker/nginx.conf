# The web apps' nginx (frontend/Dockerfile). The sites, one per hostname,
# are written at start by kutup-hosts.sh into /etc/nginx/conf.d/.
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Files are stored compressed at build time (precompress.sh) and served
    # as they are. The reverse proxy in front may speak HTTP/1.0 to us, so
    # gzip_static must not insist on 1.1. Vary tells caches the body depends
    # on Accept-Encoding.
    brotli_static on;
    gzip_static on;
    gzip_http_version 1.0;
    gzip_vary on;
    # Anything without a stored copy (a file under 1 KB) goes as it is.
    gzip off;

    include /etc/nginx/conf.d/*.conf;
}
