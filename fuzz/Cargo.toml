[package]
name = "kutup-security-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
base64 = "0.22"
futures-executor = "0.3"
libfuzzer-sys = "0.4"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.97.2" }
serde_json = "1"
kutup-chat-proto = { path = "../crates/kutup-chat-proto" }
kutup-crypto = { path = "../crates/kutup-crypto", default-features = false }
kutup-federation-proto = { path = "../crates/kutup-federation-proto" }

[[bin]]
name = "account_envelope_parser"
path = "fuzz_targets/account_envelope_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "drive_envelope_parser"
path = "fuzz_targets/drive_envelope_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profile_envelope_parser"
path = "fuzz_targets/profile_envelope_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "account_policy_parsers"
path = "fuzz_targets/account_policy_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_sender_parsers"
path = "fuzz_targets/sealed_sender_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mls_control_parsers"
path = "fuzz_targets/mls_control_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chat_media_parsers"
path = "fuzz_targets/chat_media_parsers.rs"
test = false
doc = false
bench = false
